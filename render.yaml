###############################################################################
# 信测通 - Render 一键部署配置（免费层）
# 用法：
#   1. 把这个仓库 push 到 GitHub
#   2. 在 https://render.com 用 GitHub 账号登录
#   3. New → Blueprint → 选这个仓库 → Apply
#   4. 5 分钟后拿到 2 个 URL：
#      - https://xinceutong-api.onrender.com  (后端 API)
#      - https://xinceutong-web.onrender.com  (前端 H5)
#   5. 第一次部署跑完后，修改 api 的环境变量 VITE_API_BASE_URL（前端 build 用），
#      触发重新部署前端即可。
#
# 注意事项：
#   - Render 免费层 Web Service 15 分钟无活动会休眠，首次访问冷启动 30s
#   - PostgreSQL 免费层 90 天后过期，到期前 7 天会邮件提醒
#   - 本地 SQLite 文件请勿上传（render.yaml 已 gitignore）
###############################################################################

services:
  # ========== 后端 API（FastAPI）==========
  - type: web
    name: xinceutong-api
    runtime: python
    region: singapore        # 离中国大陆最近
    plan: free
    rootDir: xinceutong-server
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: |
      echo "==== alembic 迁移 ====" &&
      alembic upgrade head &&
      echo "==== 初始化数据（首次部署）====" &&
      python scripts/init_product_types.py || echo "(可重复执行，已存在则跳过)" &&
      python scripts/init_site_config.py    || echo "(可重复执行，已存在则跳过)" &&
      python scripts/init_scorecard.py      || echo "(可重复执行，已存在则跳过)" &&
      echo "==== 启动 uvicorn ====" &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: xinceutong-db
          property: connectionString
      - key: REDIS_DISABLED
        value: "1"            # 免费层无 Redis，显式关闭
      - key: JWT_SECRET
        generateValue: true   # Render 自动生成随机密钥
      - key: CORS_ORIGINS
        value: '["*"]'        # H5 在不同域名访问，放开
      - key: ASSESSMENT_BASE_PRICE
        value: "9.99"
      - key: FREE_TRIAL_PER_USER
        value: "1"

  # ========== 前端 H5（Static Site）==========
  - type: web
    name: xinceutong-web
    runtime: static
    region: singapore
    plan: free
    rootDir: xinceutong-miniapp
    buildCommand: |
      echo "==== 编译 H5（API 指向后端）====" &&
      export VITE_API_BASE_URL=https://xinceutong-api.onrender.com &&
      npx uni build -p h5
    staticPublishPath: dist/build/h5
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://xinceutong-api.onrender.com

  # ========== PostgreSQL 数据库（免费层 90 天）==========
  - type: psql
    name: xinceutong-db
    plan: free
    region: singapore
    ipAllowList: []          # 仅 Render 内部访问
    # 免费层 1GB 存储 / 256MB 内存 / 97MB RAM
    # 注意：到期前要手动续期或迁数据
